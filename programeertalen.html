<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mijn Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="icon" href="./img/oog.png" type="image/png" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.clouds.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>


        @media (min-width: 2560px) {
            main {
                min-height: calc(100vh - 200px);
            }

            footer {
                height: 200px;
                display: flex;
                align-items: center;
            }


            #vanta-bg {
                min-height: 100vh;
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                z-index: 0;
            }

            .skill-icon {
                font-size: 3rem !important; /* 48px */
                margin-bottom: 1.5rem !important;
            }

            /* Vergroot de icon text */
            .skill-text {
                font-size: 1.25rem !important; /* 20px */
            }

            h2 {
                font-size: 2.5rem; /* 40px */
                margin-bottom: 3rem;
            }

            .grid {
                gap: 3rem;
            }

            .text-xl {
                font-size: 1.75rem; /* 28px */
            }

            .text-md {
                font-size: 1.25rem; /* 20px */
            }

            .bg-white.p-4 {
                padding: 2rem;
                border-radius: 1rem;
            }

            .text-2xl {
                font-size: 2rem; /* 32px */
            }

            .text-sm {
                font-size: 1rem; /* 16px */
            }

            #frontend-core,
            #frontend-frameworks,
            #backend-core,
            #backend-frameworks,
            #databases-tools {
                font-size: 3rem !important; /* 48px */
                margin-bottom: 1.5rem;

            }

            /* Specifieke aanpassing voor Expo icon */
            #databases-tools .fa-chevron-up {
                transform: scale(1.5);
            }

            /* Text onder icons */
            .text-gray-800.font-medium.text-sm {
                font-size: 1.25rem !important; /* 20px */
            }

            .fa-2x {
                font-size: 2.5rem;
            }

            [class^="fa-"],
            [class*=" fa-"] {
                font-size: 3rem !important;
                margin-bottom: 1.5rem;
            }

            /* Specifieke aanpassing voor Expo icon */
            .fa-chevron-up {
                transform: scale(1.5);
            }

            /* Text onder icons */
            .skill-text {
                font-size: 1.25rem !important;
            }

        }
    </style>
</head>
<nav class="bg-white shadow-md py-4 px-6 flex justify-between items-center">
    <div class="text-xl font-bold text-indigo-600" data-translate="navbarTitle">Mijn Portfolio</div>

    <div class="flex items-center space-x-6">
        <a href="./index.html"
           class="nav-link text-gray-700  font-medium"
           data-translate="navHome">Home</a>
        <a href="projecten.html"
           class="nav-link text-gray-700  font-medium"
           data-translate="navProjects">Projecten</a>
        <a href="programeertalen.html"
           class="nav-link text-gray-700  font-medium"
           data-translate="navLanguages">Programmeertalen</a>


        <!-- Taalwissel toggle -->
        <div class="flex items-center gap-2">
            <span class="text-sm font-medium text-gray-700">NL</span>
            <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" id="langToggle" class="sr-only peer">

                <script>
                    const currentLanguage = 'en'; // of haal het uit localStorage, etc.
                    const checkbox = document.getElementById('langToggle');
                    checkbox.checked = currentLanguage === 'en';
                </script>
                <div class="w-12 h-7 bg-gray-300 rounded-full peer peer-checked:bg-indigo-600 transition-all duration-300 shadow-inner"></div>
                <div class="absolute left-1 top-1 w-5 h-5 bg-white rounded-full transition-all duration-300 peer-checked:translate-x-5 shadow"></div>
            </label>
            <span class="text-sm font-medium text-gray-700">EN</span>
        </div>
    </div>
</nav>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen">


<main class="py-10 px-6 max-w-[2400px] mx-auto">
    <div id="vanta-bg" class="pb-20"></div>
    <h2 class="text-indigo-700 text-3xl font-bold mb-10 text-center">Skills</h2>

    <div class="grid md:grid-cols-3 gap-8">

        <!-- Frontend -->
        <div>
            <div class="mb-6">
                <h3 class="text-xl text-indigo-600 font-semibold mb-4 text-center">Frontend</h3>
                <div id="frontend-core" class="grid grid-cols-2 gap-4 mb-6"></div>

                <h4 class="text-md text-indigo-500 font-medium mb-3 text-center">Frameworks & Libraries</h4>
                <div id="frontend-frameworks" class="grid grid-cols-2 gap-4"></div>
            </div>
        </div>

        <!-- Backend -->
        <div>
            <div class="mb-6">
                <h3 class="text-xl text-indigo-600 font-semibold mb-4 text-center">Backend</h3>
                <div id="backend-core" class="grid grid-cols gap-4 mb-6"></div>

                <h4 class="text-md text-indigo-500 font-medium mb-3 text-center">Frameworks</h4>
                <div id="backend-frameworks" class="grid grid-cols gap-4"></div>
            </div>
        </div>

        <!-- Databases & Tools -->
        <div>
            <h3 class="text-xl text-indigo-600 font-semibold mb-4 text-center">Databases & Tools</h3>
            <div id="databases-tools" class="grid grid-cols-2 gap-4"></div>
        </div>

    </div>
</main>
<footer class="bg-white text-indigo-600 py-6 mt-auto">
    <div class="max-w-7xl mx-auto flex justify-between items-center h-full">
        <!-- Left Side: Name and Study -->
        <div class="flex flex-col">
            <p class="text-lg font-semibold" id="name">Jonah Beijer</p>
            <p class="text-sm" id="study">Studie: CMGT</p>
        </div>

        <!-- Right Side: Social Links with Icons -->
        <div class="flex space-x-6">
            <a href="https://github.com/JonahBeijer" class="hover:text-indigo-400" target="_blank">
                <i class="fab fa-github fa-2x"></i>
            </a>
            <a href="mailto:jonahbeijer@gmail.com" class="hover:text-indigo-400">
                <i class="fas fa-envelope fa-2x"></i>
            </a>
            <a href="https://www.linkedin.com/in/jonah-beijer/" class="hover:text-indigo-400" target="_blank">
                <i class="fab fa-linkedin fa-2x"></i>
            </a>
        </div>
    </div>
</footer>

<!-- Script -->
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script type="module">
    import { currentLanguage, setLanguage, updateNavAnimations } from './language.js';

    document.addEventListener('DOMContentLoaded', () => {
        // Initializeer animaties
        updateNavAnimations();

        // Taalwissel handler
        document.getElementById('langToggle').addEventListener('change', (e) => {
            const newLang = e.target.checked ? 'en' : 'nl';
            setLanguage(newLang);
        });
    });

    // Herinitialiseer animaties bij elke taalverandering
    document.addEventListener('languageChanged', () => {
        setTimeout(updateNavAnimations, 50);
    });
    // Initialize animations
    AOS.init({
        once: true,
        duration: 600,
        offset: 50,
    });

    // Set initial language
    document.addEventListener("DOMContentLoaded", () => {
        setLanguage(currentLanguage);

        // Animatie initialisatie
        document.querySelectorAll('.nav-link').forEach(link => {
            const text = link.textContent.trim();
            link.innerHTML = text.split('').map((char, index) =>
                `<span class="char" style="transition-delay: ${index * 30}ms">${char}</span>`
            ).join('');
        });
    });


    // Handle language toggle
    document.getElementById("langToggle").addEventListener("click", () => {
        const newLang = currentLanguage === 'nl' ? 'en' : 'nl';
        setLanguage(newLang);
    });

    const skills = {
        frontendCore: [
            { name: 'HTML/CSS', icon: 'fa-brands fa-html5 text-orange-500 ' },
            { name: 'JavaScript', icon: 'fa-brands fa-js text-yellow-500' }
        ],
        frontendFrameworks: [
            { name: 'React + JSX', icon: 'fa-brands fa-react text-blue-500' },
            { name: 'TailwindCSS', icon: 'fa-brands fa-css3-alt text-teal-400' },
            { name: 'Excalibur', icon: 'fas fa-gamepad text-purple-500' }
        ],
        backendCore: [
            { name: 'PHP', icon: 'fab fa-php text-indigo-500' }
        ],
        backendFrameworks: [
            { name: 'Laravel', icon: 'fab fa-laravel text-red-600' }
        ],
        databasesTools: [
            { name: 'MySQL/SQLite', icon: 'fas fa-database text-blue-400' },
            { name: 'MongoDB', icon: 'fas fa-database text-green-400' },
            { name: 'Vite', icon: 'fas fa-toolbox text-gray-500' },
            {name: 'Expo', icon: 'fas fa-solid fa-chevron-up'}
        ]
    };

    function renderSkills(containerId, skills) {
        const container = document.getElementById(containerId);
        skills.forEach(skill => {
            const div = document.createElement('div');
            div.className = "bg-white p-4 rounded-lg shadow-md hover:shadow-xl transition transform hover:scale-105 text-center";

            div.innerHTML = `
                <i class="${skill.icon} text-2xl mb-2 block mx-auto"></i>
                <p class="text-gray-800 font-medium text-sm">${skill.name}</p>
            `;
            container.appendChild(div);
        });
    }

    // Render alle secties
    renderSkills('frontend-core', skills.frontendCore);
    renderSkills('frontend-frameworks', skills.frontendFrameworks);
    renderSkills('backend-core', skills.backendCore);
    renderSkills('backend-frameworks', skills.backendFrameworks);
    renderSkills('databases-tools', skills.databasesTools);

    VANTA.CLOUDS({
        el: "body",
        mouseControls: false,
        touchControls: true,
        gyroControls: false,
        minHeight: 200.00,
        minWidth: 200.00,
        skyColor: 0x53ed,
    })

</script>

</body>
</html>
