<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-translate="meerkatGamingTitle">Meerkat Gaming - Projectdetails</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/style.css">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        .fade-in {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
        }
        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen">

<!-- ✅ Navbar -->
<nav class="bg-white shadow-md py-4 px-6 flex justify-between items-center">
    <div class="text-xl font-bold text-indigo-600" data-translate="navbarTitle">Mijn Portfolio</div>

    <div class="flex items-center space-x-6">
        <a href="../index.html" class="text-gray-700 hover:text-indigo-500 font-medium" data-translate="navHome">Home</a>
        <a href="projecten.html" class="text-gray-700 hover:text-indigo-500 font-medium" data-translate="navProjects">Projecten</a>
        <a href="programeertalen.html" class="text-gray-700 hover:text-indigo-500 font-medium" data-translate="navLanguages">Programmeertalen</a>

        <!-- Taalwissel toggle -->
        <div class="flex items-center gap-2">
            <span class="text-sm font-medium text-gray-700">NL</span>
            <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" id="langToggle" class="sr-only peer">

                <script>
                    const currentLanguage = 'en'; // of haal het uit localStorage, etc.
                    const checkbox = document.getElementById('langToggle');
                    checkbox.checked = currentLanguage === 'en';
                </script>
                <div class="w-12 h-7 bg-gray-300 rounded-full peer peer-checked:bg-indigo-600 transition-all duration-300 shadow-inner"></div>
                <div class="absolute left-1 top-1 w-5 h-5 bg-white rounded-full transition-all duration-300 peer-checked:translate-x-5 shadow"></div>
            </label>
            <span class="text-sm font-medium text-gray-700">EN</span>
        </div>
    </div>
</nav>

<!-- ✅ Detailpagina voor project "Meerkat Gaming" -->
<main class="p-8 max-w-7xl mx-auto">
    <h1 class="text-3xl font-bold text-indigo-700 mb-8 text-center" data-translate="meerkatGamingTitle">Meerkat Gaming - Projectdetails</h1>

    <div class="bg-white p-8 rounded-lg shadow-lg">
        <div class="flex flex-col lg:flex-row">
            <div class="lg:w-1/2 mb-8 lg:mb-0">
                <img src="../img/meerkatgaming.png" alt="Meerkat Gaming Screenshot" class="w-full h-auto object-cover rounded-lg shadow-md">
            </div>
            <div class="lg:w-1/2 lg:pl-8">
                <h2 class="text-2xl font-semibold text-indigo-600 mb-4" data-translate="aboutTitle">Over het project</h2>
                <p class="text-gray-700 mb-4" data-translate="meerkatGamingAbout">
                    Meerkat Gaming is een gaming-gerelateerde website gemaakt in teamverband...
                </p>
                <h3 class="text-xl font-medium text-indigo-500 mb-4" data-translate="techTitle">Technologieën</h3>
                <div class="flex flex-wrap gap-2 mb-6">
                    <span class="bg-indigo-100 text-indigo-600 px-4 py-2 rounded-full text-sm font-semibold">HTML</span>
                    <span class="bg-indigo-100 text-indigo-600 px-4 py-2 rounded-full text-sm font-semibold">CSS</span>
                    <span class="bg-indigo-100 text-indigo-600 px-4 py-2 rounded-full text-sm font-semibold">JSX</span>
                    <span class="bg-indigo-100 text-indigo-600 px-4 py-2 rounded-full text-sm font-semibold">Javascript</span>
                    <span class="bg-indigo-100 text-indigo-600 px-4 py-2 rounded-full text-sm font-semibold">React</span>
                    <span class="bg-indigo-100 text-indigo-600 px-4 py-2 rounded-full text-sm font-semibold">Vite</span>
                    <span class="bg-indigo-100 text-indigo-600 px-4 py-2 rounded-full text-sm font-semibold">MongoDB</span>

                </div>

                <div class="flex space-x-6 items-center">
                    <a href="https://github.com/JonahBeijer/webapplicatie-React" target="_blank" class="text-gray-700 hover:text-indigo-600" title="Frontend">
                        <i class="fab fa-github fa-2x"></i>
                    </a>
                    <a href="https://github.com/JonahBeijer/RESTful-webservice" target="_blank" class="text-gray-700 hover:text-indigo-600" title="Backend">
                        <i class="fab fa-github fa-2x"></i>
                    </a>
                </div>
            </div>
        </div>

        <div class="mt-8">
            <a href="projecten.html" class="text-blue-500 hover:underline" data-translate="backLink">Terug naar projecten</a>
        </div>
    </div>
</main>
<footer class="bg-indigo-600 text-white py-6 mt-10">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
        <!-- Left Side: Name and Study -->
        <div class="flex flex-col">
            <p class="text-lg font-semibold" id="name">Jonah Beijer</p>
            <p class="text-sm" id="study">Studie: CMGT</p>
        </div>

        <!-- Right Side: Social Links with Icons -->
        <div class="flex space-x-6">
            <a href="https://github.com/JonahBeijer" class="hover:text-indigo-400" target="_blank">
                <i class="fab fa-github fa-2x"></i>
            </a>
            <a href="mailto:jonahbeijer@gmail.com" class="hover:text-indigo-400">
                <i class="fas fa-envelope fa-2x"></i>
            </a>
            <a href="https://www.linkedin.com/in/jonah-beijer/" class="hover:text-indigo-400" target="_blank">
                <i class="fab fa-linkedin fa-2x"></i>
            </a>
        </div>
    </div>
</footer>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script type="module">
    import { currentLanguage, setLanguage } from '../js/language.js';

    // Initialize animations
    AOS.init({
        once: true,
        duration: 600,
        offset: 50,
    });

    // Set initial language
    document.addEventListener("DOMContentLoaded", () => {
        setLanguage(currentLanguage);
    });

    // Handle language toggle
    document.getElementById("langToggle").addEventListener("click", () => {
        const newLang = currentLanguage === 'nl' ? 'en' : 'nl';
        setLanguage(newLang);
    });
</script>

</body>
</html>
