<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-translate="portfolioTitle">Mijn Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" href="../img/oog.png" type="image/png" />

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        .fade-in {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
        }
        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }

        @keyframes dropFall {
            0% {
                opacity: 0;
                transform: translateY(-200px) scale(0.8);
            }
            70% {
                opacity: 1;
                transform: translateY(20px) scale(1.05);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .project-card {
            opacity: 0;
            animation: dropFall 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            transform-style: preserve-3d;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94),
            transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) !important;
            will-change: transform;

        }

        .project-card:hover {
            transform:
                    perspective(1000px)
                    translateZ(30px)
                    scale(1.02)
                    rotateZ(0.5deg);
            box-shadow:
                    0 25px 40px rgba(0,0,0,0.15),
                    0 0 50px rgba(79, 70, 229, 0.1);
        }

        .project-card:hover *:not(img) {
            transform: translateZ(15px);
            transition: transform 0.3s ease-out;
        }

        .project-card:hover img {
            transform: scale(1.05) translateZ(10px);
        }

        /* Voeg diepte toe aan de tags */
        .project-card:hover .tech-tag {
            transform: translateZ(15px);
        }


    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen">

<!-- ✅ Navbar -->
<nav class="bg-white shadow-md py-4 px-6 flex justify-between items-center">
    <div class="text-xl font-bold text-indigo-600" data-translate="navbarTitle">Mijn Portfolio</div>

    <div class="flex items-center space-x-6">
        <a href="../index.html"
           class="nav-link text-gray-700  font-medium"
           data-translate="navHome">Home</a>
        <a href="projecten.html"
           class="nav-link text-gray-700  font-medium"
           data-translate="navProjects">Projecten</a>
        <a href="programeertalen.html"
           class="nav-link text-gray-700 font-medium"
           data-translate="navLanguages">Programmeertalen</a>


        <!-- Taalwissel toggle -->
        <div class="flex items-center gap-2">
            <span class="text-sm font-medium text-gray-700">NL</span>
            <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" id="langToggle" class="sr-only peer">

                <script>
                    const currentLanguage = 'en'; // of haal het uit localStorage, etc.
                    const checkbox = document.getElementById('langToggle');
                    checkbox.checked = currentLanguage === 'en';
                </script>
                <div class="w-12 h-7 bg-gray-300 rounded-full peer peer-checked:bg-indigo-600 transition-all duration-300 shadow-inner"></div>
                <div class="absolute left-1 top-1 w-5 h-5 bg-white rounded-full transition-all duration-300 peer-checked:translate-x-5 shadow"></div>
            </label>
            <span class="text-sm font-medium text-gray-700">EN</span>
        </div>
    </div>
</nav>


<!-- ✅ Project Cards Container -->

    <div id="projects" class="grid gap-8 md:grid-cols-2 lg:grid-cols-3"></div>

        <!-- Right Side: Social Links with Icons -->
        <div class="flex space-x-6">

                <i class="fab fa-github fa-2x"></i>
            </a>
            <a href="mailto:jonahbeijer@gmail.com" class="hover:text-indigo-400">
                <i class="fas fa-envelope fa-2x"></i>
            </a>
            <a href="https://www.linkedin.com/in/jonah-beijer/" class="hover:text-indigo-400" target="_blank">
                <i class="fab fa-linkedin fa-2x"></i>
            </a>

<!-- ✅ AOS Animation Library -->

<!-- ✅ Combined Module Script -->
<script type="module">
    // Absolute pad voor GitHub Pages
    import { currentLanguage, setLanguage, updateNavAnimations } from '/Portofolio-CMGT/js/language.js';
    document.addEventListener('DOMContentLoaded', () => {
        // Initializeer animaties
        updateNavAnimations();

        // Taalwissel handler
        document.getElementById('langToggle').addEventListener('change', (e) => {
            const newLang = e.target.checked ? 'en' : 'nl';
            setLanguage(newLang);
        });
    });

    // Herinitialiseer animaties bij elke taalverandering
    document.addEventListener('languageChanged', () => {
        setTimeout(updateNavAnimations, 50);
    });
    // Project data with translation keys
    const projectsData = [
        {
            id: "Gamemaniac",
            title: "Gamemaniac",
            page: "Gamemaniac.html",
            descriptionKey: "projectCardDescGamemaniac",
            image: "../img/gamemaniac.png",
            tags: ["HTML", "CSS"]
        },
        {
            id: "AnimeCollection",
            title: "Anime Collection",
            page: "animecollection.html",
            descriptionKey: "projectCardDescAnimeCollection",
            image: "../img/animecollection.png",
            tags: ["HTML", "CSS", "PHP", "MySQL"]
        },
        {
            id: "MuziekGallary",
            title: "Muziek Gallary",
            page: "muziekgallery.html",
            descriptionKey: "projectCardDescMuziekGallary",
            image: "../img/muziekgallery.png",
            tags: ["HTML", "CSS", "JavaScript", "PHP"]
        },
        {
            id: "Eerste2DGame",
            title: "2D Game",
            page: "game.html",
            descriptionKey: "projectCardDescEerste2DGame",
            image: "../img/game.png",
            tags: ["HTML", "CSS" , "JavaScript", "Excalibur"]
        },
        {
            id: "SpinShare",
            title: "SpinShare",
            page: "SpinShare.html",
            descriptionKey: "projectCardDescSpinShare",
            image: "../img/spinshare.png",
            tags: ["HTML", "CSS", "JavaScript", "PHP", "Laravel" , "SQLite"]
        },
        {
            id: "MeerkatGaming",
            title: "Meerkat Gaming",
            page: "meerkatgaming.html",
            descriptionKey: "projectCardDescMeerkatGaming",
            image: "../img/meerkatgaming.png",
            tags: ["HTML" , "CSS" , "JSX", "JavaScript", "React" , "Vite" , "MongoDB"]
        },

        {
            id: "VintageApp",
            title: "Vintage App",
            page: "vintageapp.html",
            descriptionKey: "projectCardDescVintageApp",
            image: "../img/vintageapp.png",
            tags: ["HTML" , "CSS" , "JavaScript", "Expo"]
        },

        {
            id: "Chatbot",
            title: "Chatbot",
            page: "chatbot.html",
            descriptionKey: "projectCardDescChatbot",
            image: "../img/chatbot.png",
            tags: ["HTML" , "CSS" , "JavaScript"]
        },
    ];



// Pas de renderProjects functie aan:
function renderProjects(lang) {
const projectsContainer = document.getElementById("projects");
const t = translations[lang];

projectsContainer.innerHTML = '';

projectsData.forEach((project, index) => {
const tagsHTML = project.tags.map(tag =>
`<span class="inline-block bg-indigo-600 rounded-full px-3 py-1 text-xs font-semibold text-white mr-2 mb-2 transition-colors hover:bg-indigo-700">${tag}</span>`
).join('');

const projectCard = document.createElement("div");
projectCard.className = "project-card bg-gray-800 rounded-lg shadow-lg overflow-hidden transform transition duration-300 hover:shadow-xl";

// Animation delay voor cascade effect
projectCard.style.animationDelay = `${index * 0.15}s`;

    projectCard.innerHTML = `
    <div class="relative overflow-hidden group">
        <img class="w-full h-48 object-contain bg-white transform transition duration-300"
             src="${project.image}"
             alt="${project.title}">
    </div>
    <div class="p-6 space-y-4">
        <h3 class="text-xl font-semibold text-white transform transition-transform">${project.title}</h3>
        <div class="flex flex-wrap gap-2">
            ${tagsHTML}
        </div>
        <p class="text-gray-400 text-base leading-relaxed transform transition-transform">
            ${t[project.descriptionKey]}
        </p>
        <a href="${project.page}"
           class="inline-block bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition-colors
                  transform transition-transform hover:translate-x-2">
            ${translations[lang].projectDetailsLink} →
        </a>
    </div>

`;

projectsContainer.appendChild(projectCard);
});
}

    document.addEventListener('DOMContentLoaded', () => {
        renderProjects(currentLanguage);

        document.querySelectorAll('.nav-link').forEach(link => {
            const text = link.textContent.trim();
            link.innerHTML = text.split('').map((char, index) =>
                `<span class="char" style="transition-delay: ${index * 30}ms">${char}</span>`
            ).join('');
        });

        document.querySelectorAll('.project-card').forEach(card => {
            let isHovered = false;
            const speed = 15; // Lagere waarde = meer beweging

            card.addEventListener('mouseenter', () => {
                isHovered = true;
                card.style.transition = 'all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
            });

            card.addEventListener('mousemove', (e) => {
                if(!isHovered) return;

                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                // Bereken rotatie gebaseerd op muispositie
                const rotateY = (x - rect.width/2) / speed;
                const rotateX = -(y - rect.height/2) / speed;

                // Update CSS variables
                card.style.setProperty('--rotate-x', `${rotateX}deg`);
                card.style.setProperty('--rotate-y', `${rotateY}deg`);
            });

            card.addEventListener('mouseleave', () => {
                isHovered = false;
                card.style.transform = `
                perspective(1000px)
                translateZ(0)
                scale(1)
                rotateZ(0)
                rotateX(0)
                rotateY(0)
            `;
                card.style.transition = 'all 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94)';

                // Reset alle child transforms
                card.querySelectorAll('*').forEach(el => {
                    el.style.transform = 'none';
                });
            });
        });
    });

    // Initialize animations and projects
    document.addEventListener('DOMContentLoaded', () => {
        AOS.init({ once: true, duration: 600, offset: 50 });
        renderProjects(currentLanguage);
    });

    // Language toggle handler
    document.getElementById('langToggle').addEventListener('click', () => {
        const newLang = currentLanguage === 'nl' ? 'en' : 'nl';
        setLanguage(newLang);
        renderProjects(newLang);
    });

    // Update projects when language changes
    document.addEventListener('languageChanged', (e) => {
        renderProjects(e.detail);
    });



</script>
</body>
</html>
