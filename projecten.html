<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-translate="portfolioTitle">Mijn Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        .fade-in {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
        }
        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen">

<!-- ✅ Navbar -->
<nav class="bg-white shadow-md py-4 px-6 flex justify-between items-center">
    <div class="text-xl font-bold text-indigo-600" data-translate="navbarTitle">Mijn Portfolio</div>

    <div class="flex items-center space-x-6">
        <a href="index.html" class="text-gray-700 hover:text-indigo-500 font-medium" data-translate="navHome">Home</a>
        <a href="projecten.html" class="text-gray-700 hover:text-indigo-500 font-medium" data-translate="navProjects">Projecten</a>
        <a href="programeertalen.html" class="text-gray-700 hover:text-indigo-500 font-medium" data-translate="navLanguages">Programmeertalen</a>

        <!-- Taalwissel toggle -->
        <div class="flex items-center gap-2">
            <span class="text-sm font-medium text-gray-700">🇳🇱</span>
            <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" id="langToggle" class="sr-only peer" ${currentLanguage === 'en' ? 'checked' : ''}>
                <div class="w-12 h-7 bg-gray-300 rounded-full peer peer-checked:bg-indigo-600 transition-all duration-300 shadow-inner"></div>
                <div class="absolute left-1 top-1 w-5 h-5 bg-white rounded-full transition-all duration-300 peer-checked:translate-x-5 shadow"></div>
            </label>
            <span class="text-sm font-medium text-gray-700">🇬🇧</span>
        </div>
    </div>
</nav>


<!-- ✅ Project Cards Container -->
<main class="p-8 max-w-7xl mx-auto">
    <h1 class="text-3xl font-bold text-indigo-700 mb-8 text-center" data-translate="projectsTitle">Mijn Projecten</h1>
    <div id="projects" class="grid gap-8 md:grid-cols-2 lg:grid-cols-3"></div>
</main>

<!-- ✅ AOS Animation Library -->
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

<!-- ✅ Combined Module Script -->
<script type="module">
    import { currentLanguage, translations, setLanguage } from './language.js';

    // Project data with translation keys
    const projectsData = [
        {
            id: "Gamemaniac",
            title: "Gamemaniac",
            page: "Gamemaniac.html",
            descriptionKey: "projectCardDescGamemaniac",
            image: "img/gamemaniac.png",
            tags: ["HTML", "CSS"]
        },
        {
            id: "AnimeCollection",
            title: "Anime Collection",
            page: "animecollection.html",
            descriptionKey: "projectCardDescAnimeCollection",
            image: "img/animecollection.png",
            tags: ["HTML", "CSS", "JavaScript", "PHP", "MySQL"]
        },
        {
            id: "MuziekGallary",
            title: "Muziek Gallary",
            page: "muziekgallery.html",
            descriptionKey: "projectCardDescMuziekGallary",
            image: "img/muziekgallery.png",
            tags: ["HTML", "CSS", "JavaScript", "PHP"]
        },
        {
            id: "Eerste2DGame",
            title: "Eerste 2D Game",
            page: "game.html",
            descriptionKey: "projectCardDescEerste2DGame",
            image: "img/game.png",
            tags: ["JavaScript", "Excalibur.js"]
        },
        {
            id: "SpinShare",
            title: "SpinShare",
            page: "SpinShare.html",
            descriptionKey: "projectCardDescSpinShare",
            image: "img/spinshare.png",
            tags: ["HTML", "CSS", "JavaScript", "PHP", "Laravel"]
        },
        {
            id: "MeerkatGaming",
            title: "Meerkat Gaming",
            page: "meerkatgaming.html",
            descriptionKey: "projectCardDescMeerkatGaming",
            image: "img/meerkatgaming.png",
            tags: ["HTML", "JSX", "JavaScript", "React"]
        },
    ];

    // Render projects with translations
    function renderProjects(lang) {
        const projectsContainer = document.getElementById("projects");
        const t = translations[lang];

        projectsContainer.innerHTML = '';

        projectsData.forEach((project, index) => {
            const tagsHTML = project.tags.map(tag =>
                `<span class="inline-block bg-gray-700 rounded-full px-3 py-1 text-xs font-semibold text-gray-300 mr-2 mb-2">${tag}</span>`
            ).join('');

            const projectCard = document.createElement("div");
            projectCard.className = "bg-gray-800 rounded-lg shadow-lg overflow-hidden transform transition duration-300 hover:scale-105 hover:shadow-xl";
            projectCard.setAttribute('data-aos', 'fade-up');
            projectCard.setAttribute('data-aos-delay', (index % 3) * 100);

            projectCard.innerHTML = `
                <img class="w-full h-48 object-contain bg-white" src="${project.image}" alt="${project.title}">
                <div class="p-6">
                    <h3 class="text-xl font-semibold mb-2 text-white">${project.title}</h3>
                    <div class="mb-4">${tagsHTML}</div>
                    <p class="text-gray-400 mb-4 text-base">${t[project.descriptionKey]}</p>
                    <a href="${project.page}" class="text-blue-400 hover:underline text-base font-medium" data-translate="projectDetailsLink">
                        ${translations[lang].projectDetailsLink}
                    </a>
                </div>
            `;

            projectsContainer.appendChild(projectCard);
        });

        AOS.refresh();
    }

    // Initialize animations and projects
    document.addEventListener('DOMContentLoaded', () => {
        AOS.init({ once: true, duration: 600, offset: 50 });
        renderProjects(currentLanguage);
    });

    // Language toggle handler
    document.getElementById('langToggle').addEventListener('click', () => {
        const newLang = currentLanguage === 'nl' ? 'en' : 'nl';
        setLanguage(newLang);
        renderProjects(newLang);
    });

    // Update projects when language changes
    document.addEventListener('languageChanged', (e) => {
        renderProjects(e.detail);
    });
</script>
</body>
</html>
