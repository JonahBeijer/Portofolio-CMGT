<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-translate="portfolioTitle">Mijn Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="icon" href="./img/oog.png" type="image/png" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.clouds.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        /* Animatie stijlen */
        .fade-in {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
        }
        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }

        @keyframes dropFall {
            0% { opacity: 0; transform: translateY(-200px) scale(0.8); }
            70% { opacity: 1; transform: translateY(20px) scale(1.05); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .project-card {
            opacity: 0;
            animation: dropFall 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            transform-style: preserve-3d;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94),
            transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) !important;
            will-change: transform;
        }

        .project-card:hover {
            transform: perspective(1000px) translateZ(30px) scale(1.02) rotateZ(0.5deg);
            box-shadow: 0 25px 40px rgba(0,0,0,0.15), 0 0 50px rgba(79, 70, 229, 0.1);
        }

        @media (max-width: 768px) {
            .arrow1 {
                opacity: 0;

            }
        }

    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen">

<!-- Navigatiebalk -->
<nav class="bg-white shadow-md py-4 px-6 flex justify-between items-center relative z-[1000]">
    <div class="text-xl font-bold text-blue-600" data-translate="navbarTitle">Mijn Portfolio</div>

    <!-- Hamburger menu knop -->
    <button id="mobileMenuButton" class="md:hidden focus:outline-none transition-transform duration-300 hover:scale-110">
        <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
    </button>

    <!-- Desktop menu -->
    <div class="hidden md:flex items-center space-x-6">
        <a href="./index.html" class="nav-link text-gray-700 font-medium relative" data-translate="navHome">Home</a>
        <a href="projecten.html" class="nav-link text-gray-700 font-medium relative" data-translate="navProjects">Projecten</a>
        <a href="programeertalen.html" class="nav-link text-gray-700 font-medium relative" data-translate="navLanguages">Programmeertalen</a>

        <!-- Taalwisselaar -->
        <div class="flex items-center gap-2">
            <span class="text-sm font-medium text-gray-700">NL</span>
            <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" id="langToggle" class="sr-only peer">
                <div class="w-12 h-7 bg-gray-300 rounded-full peer peer-checked:bg-blue-600 transition-all duration-300 shadow-inner"></div>
                <div class="absolute left-1 top-1 w-5 h-5 bg-white rounded-full transition-all duration-300 peer-checked:translate-x-5 shadow"></div>
            </label>
            <span class="text-sm font-medium text-gray-700">EN</span>
        </div>
    </div>

    <!-- Mobiel menu -->
    <div id="mobileMenu" class="fixed inset-0 bg-white hidden md:hidden z-[1000]">
        <div class="container mx-auto px-4 py-8 flex flex-col items-center h-full">
            <!-- Sluitknop -->
            <div class="w-full flex justify-end mb-8">
                <button id="closeMenuButton" class="text-blue-600 hover:text-blue-800 transition-colors">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <!-- Menu items -->
            <nav class="flex flex-col items-center space-y-6 w-full">
                <a href="./index.html" class="nav-link text-2xl font-medium text-gray-700 hover:text-blue-600 transition-colors relative" data-translate="navHome">Home</a>
                <a href="projecten.html" class="nav-link text-2xl font-medium text-gray-700 hover:text-blue-600 transition-colors relative" data-translate="navProjects">Projecten</a>
                <a href="programeertalen.html" class="nav-link text-2xl font-medium text-gray-700 hover:text-blue-600 transition-colors relative" data-translate="navLanguages">Programmeertalen</a>

                <!-- Taalwisselaar mobiel -->
                <div class="mt-8 pt-8 border-t border-gray-200 w-full max-w-xs text-center">
                    <div class="flex items-center justify-center gap-4">
                        <span class="text-sm font-medium text-gray-700">NL</span>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="mobileLangToggle" class="sr-only peer">
                            <div class="w-14 h-8 bg-gray-200 rounded-full peer peer-checked:bg-blue-600 transition-colors duration-300"></div>
                            <div class="absolute left-1 top-1 w-6 h-6 bg-white rounded-full transition-transform duration-300 peer-checked:translate-x-6 shadow-md"></div>
                        </label>
                        <span class="text-sm font-medium text-gray-700">EN</span>
                    </div>
                </div>
            </nav>
        </div>
    </div>
</nav>

<!-- Overlay voor mobiel menu -->
<div id="mobileMenuOverlay" class="fixed inset-0 bg-black/50 z-[999] hidden"></div>

<!-- Achtergrond animatie -->
<div id="vanta-bg" class="pb-10"></div>

<!-- Hoofdcontent -->
<main class="p-8 max-w-7xl mx-auto">
    <div class="fixed left-4 top-1/2 -translate-y-1/2 opacity-100 z-20">
        <div class="arrow1 flex flex-col items-center space-y-2">
            <i class="fas fa-arrow-down text-3xl text-white"></i>
            <span class="text-white font-semibold uppercase text-sm" data-translate="recent">Recentere werk</span>
        </div>
    </div>

    <div class="  fixed right-4 top-1/2 -translate-y-1/2 opacity-100 z-20">
        <div class="arrow1 flex flex-col items-center space-y-2">
            <i class="fas fa-arrow-up text-3xl text-white"></i>
            <span class="text-white font-semibold uppercase text-sm" data-translate="older">Vroegere projecten</span>
        </div>
    </div>

    <h1 class="text-3xl font-bold text-white mb-8 text-center" data-translate="projectsTitle">Mijn Projecten</h1>
    <div id="projects" class="grid gap-8 md:grid-cols-2 lg:grid-cols-3"></div>
</main>



<!-- Scripts -->
<script type="module">
    import { currentLanguage, setLanguage, translations, updateNavAnimations } from './language.js';

    // Project data
    const projectsData = [
        {
            id: "Gamemaniac",
            title: "Gamemaniac",
            page: "Gamemaniac.html",
            descriptionKey: "projectCardDescGamemaniac",
            image: "./img/gamemaniac.png",
            tags: ["HTML", "CSS"]
        },
        {
            id: "AnimeCollection",
            title: "Anime Collection",
            page: "animecollection.html",
            descriptionKey: "projectCardDescAnimeCollection",
            image: "./img/animecollection.png",
            tags: ["HTML", "CSS", "PHP", "MySQL"]
        },
        {
            id: "MuziekGallary",
            title: "Muziek Gallary",
            page: "muziekgallery.html",
            descriptionKey: "projectCardDescMuziekGallary",
            image: "./img/muziekgallery.png",
            tags: ["HTML", "CSS", "JavaScript", "PHP"]
        },
        {
            id: "ResBeijer",
            title: "Reserveer-systeem",
            page: "resbeijer.html",
            descriptionKey: "projectCardDescResBeijer",
            image: "./img/resbeijer.png",
            tags: ["HTML", "CSS", "JavaScript", "PHP", "MySQL"]
        },
        {
            id: "Eerste2DGame",
            title: "2D Game",
            page: "game.html",
            descriptionKey: "projectCardDescEerste2DGame",
            image: "./img/game.png",
            tags: ["HTML", "CSS" , "JavaScript", "Excalibur"]
        },
        {
            id: "SpinShare",
            title: "SpinShare",
            page: "spinshare.html",
            descriptionKey: "projectCardDescSpinShare",
            image: "./img/spinshare.png",
            tags: ["HTML", "CSS", "JavaScript", "PHP", "Laravel" , "SQLite"]
        },
        {
            id: "MeerkatGaming",
            title: "Meerkat Gaming",
            page: "meerkatgaming.html",
            descriptionKey: "projectCardDescMeerkatGaming",
            image: "./img/meerkatgaming.png",
            tags: ["HTML" , "CSS" , "JSX", "JavaScript", "React" , "Vite" , "MongoDB"]
        },

        {
            id: "VintageApp",
            title: "Vintage App",
            page: "vintageapp.html",
            descriptionKey: "projectCardDescVintageApp",
            image: "./img/vintageapp.PNG",
            tags: ["HTML" , "CSS" , "JavaScript", "Expo"]
        },

        {
            id: "Chatbot",
            title: "Chatbot",
            page: "chatbot.html",
            descriptionKey: "projectCardDescChatbot",
            image: "./img/chatbot.png",
            tags: ["HTML" , "CSS" , "JavaScript"]
        },

        {
            id: "JoJosPops",
            title: "JoJo's Pops",
            page: "jojos.html",
            descriptionKey: "projectCardDescJoJosPops",
            image: "./img/vintageapp.PNG",
            tags: ["React Native", "Expo", "Laravel"]
        },

        {
            id: "IFCC",
            title: "IFCC",
            page: "ifcc.html",
            descriptionKey: "projectCardDescIFCC",
            image: "./img/vintageapp.PNG",
            tags: ["React Native", "Expo", "Laravel"]
        },

    ];

    // Render projecten
    function renderProjects(lang) {
        const projectsContainer = document.getElementById("projects");
        const t = translations[lang];
        projectsContainer.innerHTML = '';

        projectsData.forEach((project, index) => {
            const tagsHTML = project.tags.map(tag =>
                `<span class="inline-block bg-blue-600 rounded-full px-3 py-1 text-xs font-semibold text-white mr-2 mb-2 transition-colors hover:bg-blue-700">${tag}</span>`
            ).join('');

            const projectCard = document.createElement("div");
            projectCard.className = "project-card bg-gray-800 rounded-lg shadow-lg overflow-hidden transform transition duration-300 hover:shadow-xl";
            projectCard.style.animationDelay = `${index * 0.15}s`;

            projectCard.innerHTML = `
                <div class="relative overflow-hidden group">
                    <img class="w-full h-48 object-contain bg-white transform transition duration-300"
                         src="${project.image}"
                         alt="${project.title}">
                </div>
                <div class="p-6 space-y-4">
                    <h3 class="text-xl font-semibold text-white">${project.title}</h3>
                    <div class="flex flex-wrap gap-2">${tagsHTML}</div>
                    <p class="text-gray-400 text-base leading-relaxed">
                        ${t[project.descriptionKey]}
                    </p>
                    <a href="${project.page}" class="inline-block bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors">
                        ${translations[lang].projectDetailsLink} →
                    </a>
                </div>
            `;

            projectsContainer.appendChild(projectCard);
        });
    }

    // Initialisatie
    document.addEventListener('DOMContentLoaded', () => {
        // Menu functionaliteit
        const mobileMenuButton = document.getElementById('mobileMenuButton');
        const mobileMenu = document.getElementById('mobileMenu');
        const mobileMenuOverlay = document.getElementById('mobileMenuOverlay');
        const closeMenuButton = document.getElementById('closeMenuButton');

        function toggleMobileMenu() {
            mobileMenu.classList.toggle('hidden');
            mobileMenu.classList.toggle('active');
            mobileMenuOverlay.classList.toggle('hidden');
            document.body.classList.toggle('overflow-hidden');
            mobileMenuButton.classList.toggle('active');
        }

        [mobileMenuButton, mobileMenuOverlay, closeMenuButton].forEach(element => {
            element.addEventListener('click', toggleMobileMenu);
        });

        window.addEventListener('resize', () => {
            if (window.innerWidth >= 768) {
                mobileMenu.classList.remove('active');
                mobileMenu.classList.add('hidden');
                mobileMenuOverlay.classList.add('hidden');
                document.body.classList.remove('overflow-hidden');
            }
        });

        // Taalwisselaar
        document.getElementById('langToggle').addEventListener('change', (e) => {
            const newLang = e.target.checked ? 'en' : 'nl';
            setLanguage(newLang);
        });

        document.getElementById('mobileLangToggle').addEventListener('change', (e) => {
            document.getElementById('langToggle').checked = e.target.checked;
            document.getElementById('langToggle').dispatchEvent(new Event('change'));
        });

        // Vanta.js initialisatie
        VANTA.CLOUDS({
            el: "body",
            mouseControls: false,
            touchControls: true,
            gyroControls: false,
            minHeight: 200.00,
            minWidth: 200.00,
            skyColor: 0x53ed,
        });

        // Render projecten
        renderProjects(currentLanguage);
        updateNavAnimations();
    });

    // Taalwijziging handler
    document.addEventListener('languageChanged', (e) => {
        renderProjects(e.detail);
        setTimeout(updateNavAnimations, 50);
    });
</script>
<footer class="bg-white text-blue-600 py-6 px-4 mt-auto">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
        <!-- Left Side: Name and Study -->
        <div class="flex flex-col">
            <p class="text-lg font-semibold" id="name">Jonah Beijer</p>
            <p class="text-sm" id="study">CMGT</p>
        </div>

        <!-- Right Side: Social Links with Icons -->
        <div class="flex space-x-6">
            <a href="https://github.com/JonahBeijer" class="hover:text-blue-400" target="_blank">
                <i class="fab fa-github fa-2x"></i>
            </a>
            <a href="mailto:jonahbeijer@gmail.com" class="hover:text-blue-400">
                <i class="fas fa-envelope fa-2x"></i>
            </a>
            <a href="https://www.linkedin.com/in/jonah-beijer/" class="hover:text-blue-400" target="_blank">
                <i class="fab fa-linkedin fa-2x"></i>
            </a>
        </div>
    </div>
</footer>
</body>
</html>
